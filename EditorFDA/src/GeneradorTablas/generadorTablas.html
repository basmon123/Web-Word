<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Creador de Tablas</title>
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js" type="text/javascript"></script>
    <link href="generadorTablas.css" rel="stylesheet" type="text/css" />
</head>
<body class="ms-Fabric">
    <div class="contenedor">
        <h2>Diseñar Tabla</h2>
        
        <div class="fila">
            <div class="grupo">
                <label>Filas</label>
                <input type="number" id="txtFilas" value="3" min="1" max="50">
            </div>
            <div class="grupo">
                <label>Columnas</label>
                <input type="number" id="txtCols" value="3" min="1" max="15">
            </div>
        </div>

        <label>Estilo</label>
        <select id="selEstilo">
            <option value="Grid Table 1 Light">Simple</option>
            <option value="Grid Table 4 Accent 1">Azul Corporativo</option>
            <option value="Grid Table 4 Accent 2">Naranja</option>
            <option value="Grid Table 5 Dark Accent 1">Oscuro</option>
        </select>

        <div class="preview-box">
            <span class="label-preview">Vista Previa:</span>
            <table id="tablaPreview"></table>
        </div>

        <button id="btnInsertar" class="boton-cargar">CARGAR TABLA</button>
    </div>

    <script type="text/javascript" src="generadorTablas.js"></script>
</body>
</html>
