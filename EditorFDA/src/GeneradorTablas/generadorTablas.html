<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Creador de Tablas</title>
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js" type="text/javascript"></script>
    <link href="generadorTablas.css" rel="stylesheet" type="text/css" />
</head>
<body class="ms-Fabric">
    <div class="contenedor">
        <h2>Gestor de Tablas</h2>

        <div class="seccion-bordeada">
            <label class="label-titulo">Nueva Tabla Simple:</label>
            <div class="fila-inputs">
                <input type="number" id="txtFilas" placeholder="Filas" title="Número de filas" value="3" min="1" max="20" oninput="actualizarPreview()">
                <input type="number" id="txtCols" placeholder="Cols" title="Número de columnas" value="3" min="1" max="10" oninput="actualizarPreview()">
            </div>
            
            <div class="preview-container">
                <span class="label-small">Vista Previa:</span>
                <table id="tablaPreview" class="tabla-preview"></table>
            </div>

            <button id="btnInsertar" class="boton-cargar">Crear Manual</button>
        </div>

        <div class="seccion-margen">
            <label class="label-titulo" for="ddlPlantillasTablas">Biblioteca de Plantillas:</label>
            <select id="ddlPlantillasTablas" title="Seleccione una plantilla de tabla">
                <option value="">Cargando...</option>
            </select>
            <button id="btnInsertarPlantilla" class="boton-cargar boton-azul-oscuro">Insertar Plantilla</button>
        </div>

        <details class="dev-details">
            <summary class="dev-summary">🛠️ Herramientas de Desarrollador</summary>
            <div class="dev-content">
                <p class="texto-instruccion">Selecciona una tabla en Word y pulsa para obtener su código XML limpio.</p>
                <button id="btnExtraerCodigo" class="btn-scan">ESCANEAR TABLA</button>
            </div>
        </details>
    </div>

    <script src="generadorTablas.js"></script>
</body>
</html>
