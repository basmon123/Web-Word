<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Creador de Tablas</title>
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js" type="text/javascript"></script>
    <link href="generadorTablas.css" rel="stylesheet" type="text/css" />
</head>
<body class="ms-Fabric">
    <div class="contenedor">
        <h2>Diseñar Tabla</h2>
        
        <div class="fila">
            <div class="grupo">
                <label for="txtFilas">Filas</label>
                <input type="number" id="txtFilas" title="Número de filas" value="3" min="1" max="50">
            </div>
            <div class="grupo">
                <label for="txtCols">Columnas</label>
                <input type="number" id="txtCols" title="Número de columnas" value="3" min="1" max="15">
            </div>
        </div>

        <label for="selEstilo">Estilo</label>
        <select id="selEstilo" title="Seleccionar estilo de tabla">
            <option value="Tabla con cuadrícula">Simple (Bordes)</option>
            <option value="Tabla de cuadrícula 4 - Énfasis 1">Azul Corporativo (Claro)</option>
            <option value="Tabla de cuadrícula 5 Oscura - Énfasis 1">Azul Corporativo (Oscuro)</option>
            <option value="Tabla de cuadrícula 4 - Énfasis 2">Naranja</option>
            <option value="Tabla de lista 1 Clara">Lista Limpia</option>
        </select>

        <div class="preview-box">
            <span class="label-preview">Vista Previa:</span>
            <table id="tablaPreview" role="presentation"></table>
        </div>

        <button id="btnInsertar" class="boton-cargar">CARGAR TABLA</button>
    </div>

    <script type="text/javascript" src="generadorTablas.js"></script>
</body>
</html>
