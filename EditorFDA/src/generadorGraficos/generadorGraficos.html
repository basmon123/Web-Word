<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestor de Gráficos</title>
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js" type="text/javascript"></script>
    <link href="generadorGraficos.css" rel="stylesheet" type="text/css" />
</head>
<body class="ms-Fabric">
    <div class="contenedor">
        <h2>Gestor de Gráficos</h2>

        <div class="seccion-bordeada">
            <label class="label-titulo" for="ddlEstandar">Gráfico Rápido (Estándar):</label>
            <select id="ddlEstandar" title="Seleccione tipo de gráfico">
                <option value="ColumnClustered">Columnas (Agrupadas)</option>
                <option value="Line">Líneas</option>
                <option value="Pie">Circular (Pastel)</option>
                <option value="BarClustered">Barras Horizontales</option>
                <option value="Area">Área</option>
                <option value="XYSceatter">Dispersión</option>
            </select>
            <button id="btnInsertarEstandar" class="boton-cargar">Crear Estándar</button>
        </div>

        <div class="seccion-margen">
            <label class="label-titulo" for="ddlPlantillasGraficos">Tu Biblioteca de Gráficos:</label>
            <select id="ddlPlantillasGraficos" title="Seleccione una plantilla personalizada">
                <option value="">Cargando biblioteca...</option>
            </select>
            <button id="btnInsertarPlantilla" class="boton-cargar boton-azul-oscuro">Insertar Plantilla</button>
        </div>

        <details class="dev-details">
            <summary class="dev-summary">🛠️ Herramientas de Desarrollador</summary>
            <div class="dev-content">
                <p class="texto-instruccion">Diseña un gráfico en Word, selecciónalo y pulsa aquí para guardar su ADN.</p>
                <button id="btnExtraerCodigo" class="btn-scan">ESCANEAR GRÁFICO</button>
            </div>
        </details>
    </div>

    <script src="generadorGraficos.js"></script>
</body>
</html>
